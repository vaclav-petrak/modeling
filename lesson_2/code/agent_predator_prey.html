<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predator-Prey Simulation</title>
    <style>
        :root {
            --bg-color: #0d0d1a;
            --panel-bg: #161625;
            --text-main: #ffffff;
            --text-muted: #aaaacc;
            --accent-prey: #00FFCC;
            --accent-pred: #FF3366;
            --border: #333355;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            padding: 16px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .header {
            text-align: center;
            flex-shrink: 0;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
        }

        .dashboard {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 1400px;
            flex: 1 1 0;
            min-height: 0;
        }

        .panel {
            flex: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .panel h2 {
            margin: 0 0 8px 0;
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            flex-shrink: 0;
        }

        .panel canvas {
            flex: 1 1 0;
            min-height: 0;
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 4px;
            display: block;
        }

        .controls {
            width: 100%;
            max-width: 1400px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 18px;
            flex-shrink: 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px 18px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-group label {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            user-select: none;
        }

        .control-group label span {
            color: var(--text-main);
            font-weight: bold;
        }

        .control-group input[type="range"] {
            width: 100%;
            accent-color: #8877ff;
            cursor: pointer;
        }

        .buttons {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 4px;
        }

        button {
            background-color: #333355;
            color: white;
            border: none;
            padding: 8px 22px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #444477;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Agent-Based Predator-Prey Model</h1>
    </div>

    <div class="dashboard">
        <div class="panel">
            <h2>Instantaneous Positions</h2>
            <canvas id="canvas-spatial"></canvas>
        </div>
        <div class="panel">
            <h2>Population Dynamics</h2>
            <canvas id="canvas-time"></canvas>
        </div>
        <div class="panel">
            <h2>Phase Diagram</h2>
            <canvas id="canvas-phase"></canvas>
        </div>
    </div>

    <div class="controls" id="controls"></div>
    <div class="buttons">
        <button id="btn-toggle">Pause</button>
        <button id="btn-reset">Reset Simulation</button>
    </div>

<script>
    // ==========================================
    // 1. PARAMETERS & STATE
    // ==========================================
    const WORLD_SIZE = 100.0;
    const MAX_PREY = 10000;
    const PHASE_TRAIL = 2000;

    let config = {
        INIT_PREY: 150,
        INIT_PRED: 30,
        PREY_SPEED: 1.5,
        PREY_REPRO_RATE: 0.025,
        PRED_SPEED: 2.0,
        PRED_EAT_RADIUS: 2.5,
        PRED_ENERGY_GAIN: 15.0,
        PRED_STARVE_RATE: 1.0,
        PRED_REPRO_ENERGY: 40.0,
        PRED_REPRO_RATE: 0.03,
        MIG_PROB_PREY: 0.1,
        MIG_PROB_PRED: 0.05
    };

    let prey = [];
    let predators = [];
    let history_prey = [];
    let history_pred = [];
    let current_step = 0;
    let isPaused = false;
    let animationId;

    function randn_bm() {
        let u = 0, v = 0;
        while(u === 0) u = Math.random();
        while(v === 0) v = Math.random();
        return Math.sqrt( -2.0 * Math.log( u ) ) * Math.cos( 2.0 * Math.PI * v );
    }

    // ==========================================
    // 2. INITIALIZATION
    // ==========================================
    function initSimulation() {
        prey = [];
        predators = [];
        history_prey = [];
        history_pred = [];
        current_step = 0;

        for (let i = 0; i < config.INIT_PREY; i++) {
            prey.push({ x: Math.random() * WORLD_SIZE, y: Math.random() * WORLD_SIZE });
        }
        for (let i = 0; i < config.INIT_PRED; i++) {
            predators.push({ x: Math.random() * WORLD_SIZE, y: Math.random() * WORLD_SIZE, energy: 20.0 });
        }
    }

    // ==========================================
    // 3. UI & CONTROLS SETUP
    // ==========================================
    const controlsContainer = document.getElementById('controls');

    const sliderDefs = [
        {
            key: 'PREY_SPEED',
            name: 'Prey Speed',
            min: 0.1, max: 5.0, step: 0.1
        },
        {
            key: 'PREY_REPRO_RATE',
            name: 'Prey Reproduction Rate',
            min: 0.001, max: 0.1, step: 0.001
        },
        {
            key: 'PRED_SPEED',
            name: 'Predator Speed',
            min: 0.1, max: 5.0, step: 0.1
        },
        {
            key: 'PRED_EAT_RADIUS',
            name: 'Predator Eat Radius',
            min: 0.5, max: 10.0, step: 0.5
        },
        {
            key: 'PRED_ENERGY_GAIN',
            name: 'Energy Gained Per Meal',
            min: 1, max: 50, step: 1
        },
        {
            key: 'PRED_STARVE_RATE',
            name: 'Predator Starvation Rate',
            min: 0.1, max: 5.0, step: 0.1
        },
        {
            key: 'PRED_REPRO_ENERGY',
            name: 'Predator Reproduction Energy Threshold',
            min: 10, max: 100, step: 5
        },
        {
            key: 'PRED_REPRO_RATE',
            name: 'Predator Reproduction Rate',
            min: 0.001, max: 0.1, step: 0.001
        },
        {
            key: 'MIG_PROB_PREY',
            name: 'Prey Migration Probability',
            min: 0.0, max: 1.0, step: 0.01
        },
        {
            key: 'MIG_PROB_PRED',
            name: 'Predator Migration Probability',
            min: 0.0, max: 1.0, step: 0.01
        }
    ];

    sliderDefs.forEach(def => {
        const group = document.createElement('div');
        group.className = 'control-group';
        group.innerHTML = `
            <label>${def.name} <span id="val-${def.key}">${config[def.key]}</span></label>
            <input type="range" id="slider-${def.key}" min="${def.min}" max="${def.max}" step="${def.step}" value="${config[def.key]}">
        `;
        controlsContainer.appendChild(group);

        const slider = document.getElementById(`slider-${def.key}`);
        const valLabel = document.getElementById(`val-${def.key}`);
        slider.addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            config[def.key] = val;
            valLabel.innerText = val;
        });
    });

    // Add buttons inside controls div
    const buttonsDiv = document.createElement('div');
    buttonsDiv.className = 'buttons';
    buttonsDiv.innerHTML = `
        <button id="btn-toggle">Pause</button>
        <button id="btn-reset">Reset Simulation</button>
    `;
    controlsContainer.appendChild(buttonsDiv);

    document.getElementById('btn-toggle').addEventListener('click', (e) => {
        isPaused = !isPaused;
        e.target.innerText = isPaused ? "Play" : "Pause";
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
        initSimulation();
    });

    // Remove old standalone buttons div
    document.querySelector('body > .buttons')?.remove();

    // ==========================================
    // 4. CANVAS SETUP
    // ==========================================
    const canvases = {
        spatial: document.getElementById('canvas-spatial'),
        time: document.getElementById('canvas-time'),
        phase: document.getElementById('canvas-phase')
    };
    const ctxs = {
        spatial: canvases.spatial.getContext('2d'),
        time: canvases.time.getContext('2d'),
        phase: canvases.phase.getContext('2d')
    };

    function resizeCanvases() {
        for (let key in canvases) {
            const canvas = canvases[key];
            const rect = canvas.getBoundingClientRect();
            canvas.width = Math.floor(rect.width);
            canvas.height = Math.floor(rect.height);
        }
    }
    window.addEventListener('resize', resizeCanvases);

    // ==========================================
    // 5. SIMULATION ENGINE
    // ==========================================
    function wrap(val) {
        return ((val % WORLD_SIZE) + WORLD_SIZE) % WORLD_SIZE;
    }

    function step() {
        if (isPaused) return;

        prey.forEach(p => {
            p.x = wrap(p.x + randn_bm() * config.PREY_SPEED);
            p.y = wrap(p.y + randn_bm() * config.PREY_SPEED);
        });

        predators.forEach(p => {
            p.x = wrap(p.x + randn_bm() * config.PRED_SPEED);
            p.y = wrap(p.y + randn_bm() * config.PRED_SPEED);
            p.energy -= config.PRED_STARVE_RATE;
        });

        let eaten_prey_indices = new Set();
        predators.forEach(pred => {
            for (let i = 0; i < prey.length; i++) {
                if (eaten_prey_indices.has(i)) continue;
                let dx = pred.x - prey[i].x;
                let dy = pred.y - prey[i].y;
                if (Math.sqrt(dx*dx + dy*dy) < config.PRED_EAT_RADIUS) {
                    eaten_prey_indices.add(i);
                    pred.energy += config.PRED_ENERGY_GAIN;
                    break;
                }
            }
        });

        prey = prey.filter((_, i) => !eaten_prey_indices.has(i));
        predators = predators.filter(p => p.energy > 0);

        let new_prey = [];
        if (prey.length > 0 && prey.length < MAX_PREY) {
            prey.forEach(p => {
                if (Math.random() < config.PREY_REPRO_RATE) {
                    new_prey.push({ x: wrap(p.x + randn_bm()), y: wrap(p.y + randn_bm()) });
                }
            });
        }
        prey.push(...new_prey);

        let new_preds = [];
        predators.forEach(p => {
            if (p.energy > config.PRED_REPRO_ENERGY && Math.random() < config.PRED_REPRO_RATE) {
                new_preds.push({ x: wrap(p.x + randn_bm()), y: wrap(p.y + randn_bm()), energy: p.energy / 2 });
                p.energy /= 2;
            }
        });
        predators.push(...new_preds);

        if (Math.random() < config.MIG_PROB_PREY) {
            prey.push({ x: Math.random() * WORLD_SIZE, y: Math.random() * WORLD_SIZE });
        }
        if (Math.random() < config.MIG_PROB_PRED) {
            predators.push({ x: Math.random() * WORLD_SIZE, y: Math.random() * WORLD_SIZE, energy: 20.0 });
        }

        current_step++;
        history_prey.push(prey.length);
        history_pred.push(predators.length);
    }

    // ==========================================
    // 6. DRAWING ROUTINES
    // ==========================================
    function drawSpatial() {
        const ctx = ctxs.spatial;
        const w = canvases.spatial.width;
        const h = canvases.spatial.height;
        const scaleX = w / WORLD_SIZE;
        const scaleY = h / WORLD_SIZE;

        ctx.clearRect(0, 0, w, h);

        ctx.fillStyle = '#00FFCC';
        prey.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x * scaleX, p.y * scaleY, 2, 0, Math.PI * 2);
            ctx.fill();
        });

        ctx.fillStyle = '#FF3366';
        predators.forEach(p => {
            ctx.fillRect(p.x * scaleX - 3, p.y * scaleY - 3, 6, 6);
        });
    }

    function drawTime() {
        const ctx = ctxs.time;
        const w = canvases.time.width;
        const h = canvases.time.height;
        ctx.clearRect(0, 0, w, h);

        if (history_prey.length < 2) return;

        let max_pop = Math.max(10, Math.max(...history_prey), Math.max(...history_pred));
        let max_time = Math.max(500, current_step);
        let min_time = Math.max(0, current_step - 500);

        const scaleX = w / (max_time - min_time);
        const scaleY = h / (max_pop * 1.2);

        function drawLine(history, color) {
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            for (let i = min_time; i < current_step; i++) {
                let x = (i - min_time) * scaleX;
                let y = h - (history[i] * scaleY);
                if (i === min_time) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        drawLine(history_prey, '#00FFCC');
        drawLine(history_pred, '#FF3366');
    }

    function drawPhase() {
        const ctx = ctxs.phase;
        const w = canvases.phase.width;
        const h = canvases.phase.height;
        ctx.clearRect(0, 0, w, h);

        if (history_prey.length < 2) return;

        let max_prey = Math.max(10, Math.max(...history_prey) * 1.15);
        let max_pred = Math.max(5, Math.max(...history_pred) * 1.15);

        const scaleX = w / max_prey;
        const scaleY = h / max_pred;

        let start_idx = Math.max(0, current_step - PHASE_TRAIL);

        ctx.lineWidth = 1.5;
        ctx.lineJoin = 'round';

        for (let i = start_idx; i < current_step - 1; i++) {
            let progress = (i - start_idx) / (current_step - start_idx);
            ctx.beginPath();
            ctx.strokeStyle = `rgba(136, 119, 255, ${progress * 0.8})`;
            ctx.moveTo(history_prey[i] * scaleX, h - history_pred[i] * scaleY);
            ctx.lineTo(history_prey[i+1] * scaleX, h - history_pred[i+1] * scaleY);
            ctx.stroke();
        }

        let cur_x = history_prey[current_step-1] * scaleX;
        let cur_y = h - (history_pred[current_step-1] * scaleY);

        ctx.beginPath();
        ctx.fillStyle = '#ffffff';
        ctx.arc(cur_x, cur_y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ccccff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#aaaacc';
        ctx.font = '12px sans-serif';
        ctx.fillText(`Prey: ${history_prey[current_step-1]} | Predators: ${history_pred[current_step-1]}`, 10, 20);
        ctx.fillText(`Step: ${current_step}`, 10, 40);
    }

    // ==========================================
    // 7. MAIN LOOP
    // ==========================================
    function loop() {
        step();
        drawSpatial();
        drawTime();
        drawPhase();
        setTimeout(() => {
            animationId = requestAnimationFrame(loop);
        }, 30);
    }

    initSimulation();
    setTimeout(() => {
        resizeCanvases();
        loop();
    }, 100);

</script>
</body>
</html>
